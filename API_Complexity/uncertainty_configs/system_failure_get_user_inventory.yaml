    enabled: false
    apis: []
    
  PARTIALLY_IRRELEVANT_INFORMATION:
    enabled: false
    apis: []
    
  INFORMATIONAL_NOTICE:
    enabled: false
    apis: []
  
  SYSTEM_FAILURE_ERROR:
    enabled: true
