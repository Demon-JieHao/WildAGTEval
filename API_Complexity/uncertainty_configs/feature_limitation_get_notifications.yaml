name: "Feature Limitation Errors Only"
description: "Enable only FEATURE_LIMITATION_ERROR uncertainties - tests LLM problem-solving skills"

uncertainties:
  FEATURE_LIMITATION_ERROR:
    enabled: true
    apis:
      - get_notifications
    
  PARTIALLY_IRRELEVANT_INFORMATION:
    enabled: false
    apis: []
    
  INFORMATIONAL_NOTICE:
    enabled: false
    apis: []
  
  ADHOC:
    enabled: true
    apis:
      - track_order
      - lock_lock
      - lock_unlock
      - color_set
      - get_call_history
      - make_call
      - play
      - stock_price

metadata:
  total_uncertainties: 1
  creation_date: "2025-07-15"
  use_case: "Test LLM adaptation to service limitations and error handling"
